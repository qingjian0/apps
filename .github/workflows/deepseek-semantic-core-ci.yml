name: DeepSeek semantic core CI

on:
  push:
    branches: [work/deepseek-universal-hook-audit]
    paths:
      - 'engine/semantic-core/**'
      - '.github/workflows/deepseek-semantic-core-ci.yml'
  pull_request:
    paths:
      - 'engine/semantic-core/**'
      - '.github/workflows/deepseek-semantic-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-semantic-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Run semantic core tests
        working-directory: engine/semantic-core
        run: gradle --no-daemon clean test
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-core-test-results
          path: engine/semantic-core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

name: DeepSeek universal Hook evidence audit

on:
  push:
    branches: [work/deepseek-universal-hook-audit]
    paths:
      - .github/workflows/deepseek-universal-hook-audit.yml
      - scripts/audit_deepseek_apk.py
      - scripts/aggregate_deepseek_hook_audit.py
      - DeepSeek_2.7.5.apk
      - deepseek271.apk
      - deepseek-2-7-2.apk
      - "deepseek 273.apk"
      - com.deepseek.chat_2.7.4-294_1arch_3dpi_23lang_8b3ec3b6e7e5bfc2253e9c86dfc4c4e7_apkmirror.com.apkm
      - dsprobe.log
      - deekseep_vision.log
      - deepseek-sse-hook-evidence.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - version: "2.7.1"
            input: deepseek271.apk
          - version: "2.7.2"
            input: deepseek-2-7-2.apk
          - version: "2.7.3"
            input: "deepseek 273.apk"
          - version: "2.7.4"
            input: com.deepseek.chat_2.7.4-294_1arch_3dpi_23lang_8b3ec3b6e7e5bfc2253e9c86dfc4c4e7_apkmirror.com.apkm
          - version: "2.7.5"
            input: DeepSeek_2.7.5.apk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deepseek-universal-hook-audit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install static analysis tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o jadx.zip
          unzip -q jadx.zip -d jadx-dist
          chmod +x jadx-dist/bin/jadx
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          echo "56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  apktool.jar" | sha256sum -c -
      - name: Fetch newly uploaded APK input from main when absent on audit branch
        shell: bash
        env:
          INPUT_APK: ${{ matrix.input }}
        run: |
          set -euo pipefail
          if [ ! -f "$INPUT_APK" ]; then
            ENCODED_PATH="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["INPUT_APK"], safe=""))')"
            curl -fL --retry 3 "https://raw.githubusercontent.com/qingjian0/apps/main/$ENCODED_PATH" -o "$INPUT_APK"
          fi
          test -s "$INPUT_APK"
      - name: Audit APK or APKM
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_deepseek_apk.py \
            --input "${{ matrix.input }}" \
            --version "${{ matrix.version }}" \
            --work "work/${{ matrix.version }}" \
            --out "audit/${{ matrix.version }}" \
            --jadx "$PWD/jadx-dist/bin/jadx" \
            --apktool "$PWD/apktool.jar"
      - name: Validate generated evidence
        run: |
          set -euo pipefail
          python3 -m json.tool "audit/${{ matrix.version }}/summary.json" >/dev/null
          python3 -m json.tool "audit/${{ matrix.version }}/hook-candidates.json" >/dev/null
          gzip -t "audit/${{ matrix.version }}/methods.jsonl.gz"
          gzip -t "audit/${{ matrix.version }}/classes.jsonl.gz"
          gzip -t "audit/${{ matrix.version }}/call-edges.jsonl.gz"
          test -s "audit/${{ matrix.version }}/candidate-methods.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-universal-${{ matrix.version }}
          path: audit/${{ matrix.version }}/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deepseek-universal-hook-audit
      - uses: actions/download-artifact@v4
        with:
          pattern: deepseek-universal-*
          path: incoming
      - name: Assemble version indexes and analyze repository logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for version in 2.7.1 2.7.2 2.7.3 2.7.4 2.7.5; do
            artifact="deepseek-universal-${version}"
            test -d "incoming/$artifact"
            mkdir -p "audit/$version"
            cp -a "incoming/$artifact/." "audit/$version/"
          done
          python3 scripts/aggregate_deepseek_hook_audit.py
          python3 -m json.tool audit/universal-hook/semantic-method-matches.json >/dev/null
          python3 -m json.tool audit/universal-hook/probe-log-summary.json >/dev/null
          python3 -m json.tool audit/universal-hook/evidence-zip-inventory.json >/dev/null
      - name: Commit audit results back to this repository branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/2.7.1 audit/2.7.2 audit/2.7.3 audit/2.7.4 audit/2.7.5 audit/universal-hook
          if git diff --cached --quiet; then
            echo "No audit changes to commit"
          else
            git commit -m "Publish multi-version DeepSeek Hook audit evidence"
            git push origin HEAD:work/deepseek-universal-hook-audit
          fi
      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-universal-hook-final-report
          path: audit/universal-hook/
          if-no-files-found: error
          retention-days: 30

name: DeepSeek 2.7.5 APK evidence audit

on:
  push:
    branches:
      - work/deepseek-275-apk-audit
    paths:
      - .github/workflows/deepseek-275-apk-audit.yml
      - DeepSeek_2.7.5.apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify checked-out APK and download JADX
        shell: bash
        run: |
          set -euo pipefail
          test -s DeepSeek_2.7.5.apk
          curl -fL --retry 3 --retry-delay 2 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o jadx.zip
          unzip -q jadx.zip -d jadx-dist
          chmod +x jadx-dist/bin/jadx
          sha256sum DeepSeek_2.7.5.apk > apk.sha256
          unzip -Z1 DeepSeek_2.7.5.apk | grep -E '^classes[0-9]*\.dex$' > dex-files.txt
          unzip -l DeepSeek_2.7.5.apk | grep -E 'classes[0-9]*\.dex$' > dex-inventory.txt
      - name: Decompile and build evidence index
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p audit
          set +e
          jadx-dist/bin/jadx --show-bad-code --no-res --threads-count 2 -d decompiled DeepSeek_2.7.5.apk > audit/jadx.stdout.log 2> audit/jadx.stderr.log
          JADX_STATUS=$?
          set -e
          printf '%s\n' "$JADX_STATUS" > audit/jadx.exit-code
          if [ ! -d decompiled/sources ]; then
            echo "JADX did not produce source output" >&2
            tail -100 audit/jadx.stderr.log >&2 || true
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, pathlib, re, zipfile, json
          apk = pathlib.Path("DeepSeek_2.7.5.apk")
          root = pathlib.Path("decompiled/sources")
          out = pathlib.Path("audit")
          terms = {
              "network": ["okhttp3", "retrofit2", "RequestBody", "ResponseBody", "Interceptor", "EventSource", "WebSocket", "HttpURLConnection", "Cronet", "ktor"],
              "endpoint": ["api.deepseek.com", "chat/completions", "text/event-stream", "deepseek.com"],
              "pow_challenge": ["challenge", "difficulty", "nonce", "proof", "pow", "captcha", "sha256", "MessageDigest"],
              "async_stream": ["Continuation", "kotlinx.coroutines", "Flow<", "callbackFlow", "suspend ", "onResponse", "onFailure", "collect("],
              "agent_tools": ["tool_calls", "function_call", "tool_choice", "agent", "tools"],
          }
          rows = []
          java_files = list(root.rglob("*.java"))
          for path in java_files:
              try: data = path.read_text(encoding="utf-8", errors="replace")
              except Exception: continue
              hits = {}
              for group, needles in terms.items():
                  found = [n for n in needles if n.lower() in data.lower()]
                  if found: hits[group] = found
              if not hits: continue
              decl = re.search(r"(?m)^\s*(?:(?:public|protected|private|abstract|final|static|synchronized)\s+)*(?:class|interface|enum|record)\s+([\w$]+)([^\n{]*)", data)
              package = re.search(r"(?m)^package\s+([\w.]+)\s*;", data)
              methods = []
              fields = []
              for line in data.splitlines():
                  m = re.match(r"\s*(?:public|protected|private)\s+(?:(?:static|final|synchronized|native|abstract)\s+)*([\w.$<>?,\[\]]+)\s+([\w$]+)\s*\(([^)]*)\)", line)
                  if m and len(methods) < 40:
                      methods.append(m.group(2) + "(" + re.sub(r"\s+", " ", m.group(3)).strip() + "):" + m.group(1).strip())
                  f = re.match(r"\s*(?:public|protected|private)\s+(?:(?:static|final|volatile|transient)\s+)*([\w.$<>?,\[\]]+)\s+([\w$]+)\s*(?:=|;)", line)
                  if f and len(fields) < 40:
                      fields.append(f.group(2) + ":" + f.group(1).strip())
              constants = []
              for value in re.findall(r'"((?:\\.|[^"\\])*)"', data):
                  if re.search(r"(https?://|deepseek|/api|/chat|stream|challenge|pow|captcha|tool)", value, re.I):
                      value = value[:180]
                      if value not in constants: constants.append(value)
                  if len(constants) >= 20: break
              rows.append((sum(len(v) for v in hits.values()), str(path.relative_to(root)),
                           package.group(1) if package else "", decl.group(1) if decl else "",
                           decl.group(2).strip() if decl else "", hits, methods, fields, constants))
          rows.sort(key=lambda x: (-x[0], x[1]))
          first_party = []
          method_sig = re.compile(r"(?m)^\s*(?!(?:return|throw|new|if|for|while|switch|catch|else|do|try|assert)\b)(?:(?:public|protected|private|static|final|synchronized|native|abstract|strictfp)\s+)*([\w.$<>?,\[\]]+)\s+([\w$]+)\s*\(([^)]*)\)")
          field_sig = re.compile(r"(?m)^\s*(?:(?:public|protected|private|static|final|volatile|transient)\s+)*([\w.$<>?,\[\]]+)\s+([\w$]+)\s*(?:=[^;]*|;)\s*$")
          class_sig = re.compile(r"(?m)^\s*(?:(?:public|protected|private|abstract|final|static|synchronized)\s+)*(?:class|interface|enum|record|@interface)\s+([\w$]+)([^\n{]*)")
          for path in java_files:
              rel = str(path.relative_to(root))
              if not (rel.startswith("defpackage/") or rel.startswith("com/deepseek/")): continue
              try: data = path.read_text(encoding="utf-8", errors="replace")
              except Exception: continue
              decl = class_sig.search(data)
              package = re.search(r"(?m)^package\s+([\w.]+)\s*;", data)
              methods, fields = [], []
              depth = 0
              in_block_comment = False
              for line in data.splitlines():
                  if depth == 1:
                      m = method_sig.match(line)
                      if m and len(methods) < 100:
                          methods.append(m.group(2) + "(" + re.sub(r"\s+", " ", m.group(3)).strip() + "):" + m.group(1).strip())
                      f = field_sig.match(line)
                      if f and len(fields) < 100:
                          fields.append(f.group(2) + ":" + f.group(1).strip())
                  scan = line
                  if in_block_comment:
                      if "*/" in scan:
                          scan = scan.split("*/", 1)[1]
                          in_block_comment = False
                      else:
                          scan = ""
                  while "/*" in scan:
                      left, right = scan.split("/*", 1)
                      if "*/" in right:
                          scan = left + right.split("*/", 1)[1]
                      else:
                          scan = left
                          in_block_comment = True
                          break
                  scan = re.sub(r'"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'', "", scan)
                  scan = scan.split("//", 1)[0]
                  depth += scan.count("{") - scan.count("}")
              first_party.append({
                  "path": rel, "package": package.group(1) if package else "",
                  "class": decl.group(1) if decl else path.stem,
                  "inheritance": decl.group(2).strip() if decl else "",
                  "methods": methods, "fields": fields,
              })
          xref_terms = [
              "PowCalculator", "nativeCalculateDeepSeekHashV1Pow", "AuthedPowSolution",
              "ServerChatChallenge", "ChallengeResponse", "X-DS-Challenge-Response",
              "X-DS-PoW-Response", "/api/v0/chat/create_pow_challenge",
              "/api/v0/chat/stop_stream", "/api/v0/chat/history_messages",
              "/api/v0/chat/completion", "/api/v0/chat/regenerate",
              "/api/v0/chat/resume_stream", "/api/v0/chat/continue",
              "/api/v0/chat/edit_message", "/api/v0/call/start",
              "text/event-stream", "ServerSentEvent", "EventSource",
              "WebSocketSession", "WebSockets", "ByteReadChannel", "readUTF8Line",
              "sse_auto_scroll_one_screen_v2", "allow_parallel_streams",
              "pow_prefetch", "pow_prefetch_count",
              "tool_calls", "function_call", "tool_choice", "tool_result",
              "ToolCall", "ToolResult", "ToolExecutor", "AgentTool",
              "kotlinx.serialization", "KSerializer", "SerialDescriptor",
              "ContentNegotiation", "encodeToString", "decodeFromString",
              "ly1", "zn3", "jw3", "y60", "qj3", "mr2", "jr2", "mw1",
              "chat_session_id", "parent_message_id", "thinking_enabled",
              "search_enabled", "preempt", "target_path",
          ]
          xrefs = {term: [] for term in xref_terms}
          for path in java_files:
              try: data = path.read_text(encoding="utf-8", errors="replace")
              except Exception: continue
              rel = str(path.relative_to(root))
              depth = 0
              current_method = None
              in_block_comment = False
              for line in data.splitlines():
                  if depth == 1:
                      m = method_sig.match(line)
                      if m:
                          current_method = m.group(2)
                  for term in xref_terms:
                      if term in line:
                          entry = {"path": rel, "method": current_method or "<class-or-initializer>"}
                          if entry not in xrefs[term] and len(xrefs[term]) < 120:
                              xrefs[term].append(entry)
                  scan = line
                  if in_block_comment:
                      if "*/" in scan:
                          scan = scan.split("*/", 1)[1]
                          in_block_comment = False
                      else:
                          scan = ""
                  while "/*" in scan:
                      left, right = scan.split("/*", 1)
                      if "*/" in right:
                          scan = left + right.split("*/", 1)[1]
                      else:
                          scan = left
                          in_block_comment = True
                          break
                  scan = re.sub(r'"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'', "", scan)
                  scan = scan.split("//", 1)[0]
                  old_depth = depth
                  depth += scan.count("{") - scan.count("}")
                  if old_depth >= 2 and depth < 2:
                      current_method = None
          with zipfile.ZipFile(apk) as z:
              dex = [(i.filename, i.file_size) for i in z.infolist() if re.fullmatch(r"classes[0-9]*\.dex", i.filename)]
          stdout = pathlib.Path("audit/jadx.stdout.log").read_text(errors="replace").splitlines()
          stderr = pathlib.Path("audit/jadx.stderr.log").read_text(errors="replace").splitlines()
          diagnostics = [x for x in stdout + stderr if re.search(r"ERROR|WARN|Exception|failed", x, re.I)]
          lines = [
              "# DeepSeek 2.7.5 APK static evidence index", "",
              f"- APK bytes: {apk.stat().st_size}",
              f"- APK SHA-256: {hashlib.sha256(apk.read_bytes()).hexdigest()}",
              f"- DEX files: {len(dex)}",
              f"- JADX Java source files: {len(java_files)}",
              f"- JADX exit code: {pathlib.Path('audit/jadx.exit-code').read_text().strip()}",
              "- Scope: static DEX decompilation and symbol indexing only; no runtime behavior is asserted.", "",
              "## DEX inventory", "",
          ]
          lines += [f"- {name}: {size:,} bytes" for name, size in dex]
          lines += ["", "## JADX diagnostics", ""]
          lines += [f"- {x[:300]}" for x in diagnostics[:40]] or ["- No warning/error lines captured in JADX stdout/stderr."]
          lines += ["", "## Cross-reference map", "",
                    "References are static symbol/string occurrences; they do not establish runtime call order.", ""]
          for term, refs in xrefs.items():
              lines.append(f"### {term}")
              lines += [f"- {entry['path']} :: {entry['method']}" for entry in refs] or ["- No references found"]
              lines.append("")
          lines += ["", "## Candidate classes", "",
                    "Ranked by matches across network, endpoint, PoW/challenge, async/stream, and agent/tool terms.",
                    "Class and method signatures are navigation evidence only, not proof of execution.", ""]
          for score, rel, pkg, cls, inheritance, hits, methods, fields, constants in rows[:150]:
              groups = "; ".join(f"{k}=[{', '.join(v)}]" for k,v in hits.items())
              lines.append(f"- **{pkg}.{cls}** ({rel}; score={score}; {inheritance}) — {groups}")
              if methods: lines.append(f"  - Methods: {', '.join(methods[:20])}")
              if fields: lines.append(f"  - Fields: {', '.join(fields[:20])}")
              if constants: lines.append(f"  - Relevant string constants: {', '.join(constants[:12])}")
          (out / "report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          (out / "candidate-index.json").write_text(json.dumps([
              {"score":s,"path":p,"package":pkg,"class":cls,"inheritance":inh,
               "matches":h,"methods":m,"fields":f,"strings":k}
              for s,p,pkg,cls,inh,h,m,f,k in rows[:500]
          ], ensure_ascii=False, indent=2), encoding="utf-8")
          (out / "cross-references.json").write_text(json.dumps(xrefs, ensure_ascii=False, indent=2), encoding="utf-8")
          (out / "first-party-class-index.json").write_text(json.dumps(first_party, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Indexed {len(rows)} candidate classes and {len(first_party)} first-party classes")
          PY
      - name: Validate and package source evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool audit/candidate-index.json >/dev/null
          python3 -m json.tool audit/cross-references.json >/dev/null
          python3 -m json.tool audit/first-party-class-index.json >/dev/null
          test -s audit/report.md
          python3 - <<'PY'
          import json, pathlib, zipfile
          root = pathlib.Path("decompiled/sources")
          out = pathlib.Path("audit")
          classes = json.loads((out / "first-party-class-index.json").read_text())
          candidates = json.loads((out / "candidate-index.json").read_text())
          xrefs = json.loads((out / "cross-references.json").read_text())
          if not classes: raise SystemExit("first-party class index is empty")
          if not candidates: raise SystemExit("candidate index is empty")
          if not xrefs.get("PowCalculator"): raise SystemExit("PowCalculator cross-reference missing")
          source_zip = out / "decompiled-first-party.zip"
          count = 0
          with zipfile.ZipFile(source_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for prefix in ("defpackage", "com/deepseek"):
                  folder = root / prefix
                  if not folder.exists(): continue
                  for p in folder.rglob("*.java"):
                      z.write(p, p.relative_to(root))
                      count += 1
          methods = sum(len(x.get("methods", [])) for x in classes)
          fields = sum(len(x.get("fields", [])) for x in classes)
          sha = pathlib.Path("apk.sha256").read_text().split()[0]
          jadx_exit = pathlib.Path("audit/jadx.exit-code").read_text().strip()
          import hashlib, subprocess, tempfile, re, shutil
          native_zip = out / "native-libraries.zip"
          native_lines = ["# Native library inventory", ""]
          native_count = 0
          with zipfile.ZipFile("DeepSeek_2.7.5.apk") as apk_zip:
              native_entries = [i for i in apk_zip.infolist() if i.filename.startswith("lib/") and i.filename.endswith(".so")]
              with zipfile.ZipFile(native_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as nz:
                  for info in native_entries:
                      data = apk_zip.read(info.filename)
                      nz.writestr(info.filename, data)
                      native_count += 1
                      native_lines += [f"## {info.filename}", f"- Bytes: {len(data):,}", f"- SHA-256: {hashlib.sha256(data).hexdigest()}"]
                      with tempfile.NamedTemporaryFile() as tmp:
                          tmp.write(data); tmp.flush()
                          if shutil.which("readelf"):
                              eh = subprocess.run(["readelf", "-h", tmp.name], capture_output=True, text=True).stdout
                              for key in ("Class:", "Data:", "Machine:"):
                                  hit = next((x.strip() for x in eh.splitlines() if key in x), None)
                                  if hit: native_lines.append(f"- {hit}")
                              syms = subprocess.run(["readelf", "-Ws", tmp.name], capture_output=True, text=True).stdout
                          else:
                              syms = ""
                          strings_out = subprocess.run(["strings", "-a", tmp.name], capture_output=True, text=True).stdout if shutil.which("strings") else ""
                          relevant = [x.strip() for x in (syms + "\n" + strings_out).splitlines() if re.search(r"pow|deepseek|hash|challenge|jni|crypto|sha|blake|signature", x, re.I)]
                          native_lines += [f"- Relevant symbol/string: {x[:220]}" for x in relevant[:30]]
                      native_lines.append("")
          (out / "native-library-index.md").write_text("\n".join(native_lines) + "\n", encoding="utf-8")
          summary = {
              "apk_sha256": sha, "jadx_exit_code": int(jadx_exit),
              "candidate_classes": len(candidates), "first_party_classes": len(classes),
              "indexed_methods": methods, "indexed_fields": fields,
              "cross_reference_terms": len(xrefs), "archived_source_files": count,
              "source_archive_bytes": source_zip.stat().st_size,
              "native_library_count": native_count, "native_archive_bytes": native_zip.stat().st_size
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          quality = [
              "# Static index quality and limitations", "",
              f"- APK SHA-256: {sha}",
              f"- JADX exit code: {jadx_exit} (non-zero may indicate partial decompilation; inspect diagnostics)",
              f"- Candidate classes: {len(candidates)}",
              f"- First-party classes indexed: {len(classes)}",
              f"- Method signatures indexed: {methods}",
              f"- Field signatures indexed: {fields}",
              f"- Static cross-reference terms: {len(xrefs)}",
              f"- Decompiled first-party source files archived: {count}",
              f"- Source archive size: {source_zip.stat().st_size:,} bytes", "",
              "## Interpretation limits", "",
              "- Candidate ranking is keyword-based navigation, not a semantic classifier.",
              "- String/symbol cross-references do not prove a runtime call path or execution order.",
              "- JADX can emit source while returning a non-zero status; all affected classes must be checked against DEX where decompilation is incomplete.",
              "- The signature index is line-oriented and brace-depth scoped; inspect archived Java source for overloads, multiline declarations, synthetic bridges, and Kotlin-generated methods.",
              "- Native library symbols/strings are reconnaissance only; they do not replace disassembly or JNI control-flow analysis.",
              "- No endpoint, PoW, stream, or Agent semantics should be claimed from keyword matches alone."
          ]
          (out / "index-quality.md").write_text("\n".join(quality) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload evidence report
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-275-static-evidence
          path: |
            audit/report.md
            audit/candidate-index.json
            audit/cross-references.json
            audit/first-party-class-index.json
            audit/summary.json
            audit/index-quality.md
            audit/decompiled-first-party.zip
            audit/native-libraries.zip
            audit/native-library-index.md
            audit/jadx.exit-code
            audit/jadx.stderr.log
            apk.sha256
            dex-files.txt
            dex-inventory.txt
          if-no-files-found: error
          retention-days: 14
